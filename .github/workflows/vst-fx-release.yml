# Build Cadenza FX (the insert-effect variant, vst-fx/) into a DRAFT release (cadenza-fx-vst-v<version>):
# Actions -> "VST release FX (draft)" -> Run workflow. dry_run (default on) builds the zip and skin
# previews as run artifacts only. Same pinned mpc-vst-plugins commit as vst-release.yml.
name: VST release FX (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
        default: 1.0.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  cadenza-fx:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: cadenza-fx-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst-fx
      build: bash vst-fx/build.sh
      host_test: bash vst-fx/test.sh
      plugin_id: cadenza-fx
      license: MIT
      about: 7-lane MIDI generator after the offline engine of Cadenza (bass groove/rolling/sub, arp, melody, pad, lead on one chord progression, incl. Goa phrygian) as an insert effect - drives synth tracks over MIDI without using a plugin instrument slot.
      dry_run: ${{ inputs.dry_run }}
